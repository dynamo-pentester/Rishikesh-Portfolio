    <!-- The world keeps the visitor's own time: paper by day, indigo after dark. -->
    <script>
      (function () {
        var t; try { t = localStorage.getItem('atlas-theme'); } catch (e) {}
        if (t !== 'day' && t !== 'night') { var h = new Date().getHours(); t = h >= 6 && h < 18 ? 'day' : 'night'; }
        document.documentElement.dataset.theme = t;
      })();
    </script>
